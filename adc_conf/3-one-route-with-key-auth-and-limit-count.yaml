consumers:
  - username: JaneDoe
    credentials:
      - name: hello
        config:
          key: jane-key
        type: key-auth
services:
  - name: Demo
    routes:
      - name: Hello
        methods:
          - GET
        plugins:
          key-auth:
            header: apikey
          limit-count:
            count: 2999999
            key: remote_addr
            key_type: var
            policy: local
            rejected_code: 429
            time_window: 1
        priority: 0
        uris:
          - /hello
    strip_path_prefix: true
    upstream:
      name: default
      hash_on: vars
      nodes:
        - host: 172.31.47.150
          port: 1980
          priority: 0
          weight: 100
      pass_host: pass
      retry_timeout: 0
      scheme: http
      type: roundrobin
    upstreams: []
